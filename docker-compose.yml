services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: decision_loop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  servicebus-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Emulator@P@ssw0rd"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    platform: linux/amd64
    environment:
      SQL_SERVER: servicebus-db
      MSSQL_SA_PASSWORD: "Emulator@P@ssw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "5672:5672"
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      servicebus-db:
        condition: service_healthy
    # distroless .NET イメージのためシェルが存在せず healthcheck 不可。
    # ai サービスは restart: on-failure で接続失敗を再試行する。

  # アプリサービス（コメントアウトするとネイティブ起動 / overmind に切り替え可能）
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      # コンテナ内の node_modules をホストの空ディレクトリで上書きしないよう保護
      - /app/apps/web/node_modules
      # vite.config.ts の api/types alias が参照するソース
      - ./apps/api/src:/app/apps/api/src
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Docker 内では api/ai コンテナのサービス名で解決する
      API_URL: "http://api:3001"
      AI_WS_URL: "ws://ai:8001"
    env_file:
      - path: .env.local
        required: false
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
    environment:
      # Docker 内では db コンテナ名で解決する（.env.local の localhost 指定を上書き）
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/decision_loop"
      # OIDC_ISSUER_URL は .env.docker（fake-auth デフォルト）または
      # .env.local（Entra 等に上書き）で設定する
      # ai サービスと同じ値。servicebus は Docker ネットワーク上のサービス名
      AZURE_SERVICE_BUS_CONNECTION_STRING: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true"
      AZURE_SERVICE_BUS_QUEUE_NAME: "decision-loop"
    env_file:
      - path: .env.docker   # fake-auth デフォルト（コミット済み）
        required: false
      - path: .env.local    # ユーザー上書き（Entra 等・gitignore）
        required: false
    # db 起動タイミング依存の接続失敗に備えたフォールバック
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      servicebus:
        condition: service_started

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
      target: dev
    ports:
      - "8001:8001"
    volumes:
      - ./services/ai/main.py:/app/main.py
      - ./services/ai/consumers:/app/consumers
      - ./services/ai/routers:/app/routers
      - ./services/ai/schemas:/app/schemas
      - ./services/ai/llm:/app/llm
      - ./services/ai/integrations:/app/integrations
      - ./services/ai/pipeline:/app/pipeline
      - ./services/ai/rag:/app/rag
      - ./services/ai/prompts:/app/prompts
      - ./services/ai/agent:/app/agent
    environment:
      # Docker 内では servicebus コンテナ名で解決する（.env.local の localhost 指定を上書き）
      AZURE_SERVICE_BUS_CONNECTION_STRING: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true"
      # Docker network 内の api コンテナへの内部通信 URL
      INTERNAL_API_BASE_URL: "http://api:3001"
    env_file:
      - path: .env.local
        required: false
    # servicebus は healthcheck 不可のため service_started + restart: on-failure で再試行
    restart: on-failure
    depends_on:
      servicebus:
        condition: service_started

  fake-auth:
    build:
      context: .
      dockerfile: services/fake-auth/Dockerfile
    ports:
      - "3007:3007"
    volumes:
      - ./services/fake-auth/src:/app/services/fake-auth/src
      - ./services/fake-auth/keys:/app/services/fake-auth/keys
      # コンテナ内の node_modules をホストの空ディレクトリで上書きしないよう保護
      - /app/services/fake-auth/node_modules
    environment:
      PORT: "3007"
      # api コンテナが Docker network 上で fake-auth の JWKS を取得し、
      # token の iss クレームと issuer 検証を一致させるため service 名を使う。
      # host 側の curl からは port mapping (3007:3007) で localhost:3007 経由で
      # /login にアクセス可能（iss クレームは fake-auth:3007 になるが、
      # フロントは iss を検証しないため副作用なし）。
      ISSUER: "http://fake-auth:3007"
    env_file:
      - path: .env.local
        required: false

volumes:
  postgres_data:
