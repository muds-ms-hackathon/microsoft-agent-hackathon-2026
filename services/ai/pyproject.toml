[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "azure-servicebus>=7.14.3",
  "fastapi[standard]>=0.136.1",
  "openai>=2.37.0",
  "httpx>=0.28.1",
  "python-dateutil>=2.9.0.post0",
]

[dependency-groups]
dev = [
  "ruff>=0.15.13",
  "mypy>=2.1.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
